# plugin-docker-buildx is the CA-baked variant; the registry's cert is not in the default trust store.
when:
  - event: tag
    ref: refs/tags/v*

steps:
  - name: docker
    image: registry.example.com/internal/plugin-docker-buildx:latest
    settings:
      registry: registry.example.com
      repo: registry.example.com/internal/pdbmux
      dockerfile: Dockerfile
      buildkit_config: |
        [registry."registry.example.com"]
          ca = ["/etc/docker/certs.d/registry.example.com/ca.crt"]
      build_args:
        VERSION: ${CI_COMMIT_TAG}
      tags:
        - ${CI_COMMIT_TAG}
        - latest
    backend_options:
      kubernetes:
        serviceAccountName: default
        resources:
          requests:
            memory: 1Gi
            cpu: 1
          limits:
            memory: 2Gi
            cpu: 2
